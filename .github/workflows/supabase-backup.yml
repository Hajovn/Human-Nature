# Weekly backup of the Live Supabase database (docs/SUPABASE-PLAN.md, Stage 7; restore steps
# in docs/SUPABASE.md). The Free plan has no backups of its own.
#
# The dump (roles, schema and data, including log-in accounts) is ENCRYPTED before it is
# stored, because this repository is public. It is kept for 90 days as a workflow artifact.
# Files in Storage (teacher-files) are NOT included: keep the originals elsewhere.
#
# Needs repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_DB_URL    Live project's "Session pooler" connection string, with the database
#                      password filled in (percent-encoded if it has special characters)
#   BACKUP_PASSPHRASE  long random passphrase; keep a copy in the password manager, or the
#                      backups can't be opened

name: Supabase backup

on:
  schedule:
    - cron: '43 2 * * 0' # Sundays, 02:43 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the repository secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql

      - name: Check the dump
        run: |
          ls -l backup
          # Every table this site relies on must be in the data dump.
          for table in auth.users public.profiles public.invite_codes public.saved_resources public.progress public.feedback_votes; do
            grep -q "COPY \"\?${table%%.*}\"\?\.\"\?${table#*.}\"\?" backup/data.sql \
              || { echo "::error::$table is missing from data.sql"; exit 1; }
          done

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="supabase-backup-$(date -u +%Y-%m-%d)"
          tar -czf - -C backup . \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                  --symmetric --cipher-algo AES256 --output "$name.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
